pluginManagement {
  plugins {
    id 'biz.aQute.bnd.workspace' version bnd_version
    id 'org.geckoprojects.bnd.update' version bnd_update_version
  }
  repositories {
    maven {
      url = uri(bnd_snapshots)
      content {
        snapshotsOnly()
        includeGroup('biz.aQute.bnd')
        includeGroup('biz.aQute.bnd.workspace')
      }
    }
    // Only for the bnd update plugin, which has no release yet.
    maven {
      url = uri('https://central.sonatype.com/repository/maven-snapshots/')
      content {
        snapshotsOnly()
        includeGroup('org.geckoprojects.bnd')
        includeGroup('org.geckoprojects.bnd.update')
      }
    }
    mavenCentral()
    gradlePluginPortal()
  }
}
plugins {
  id 'biz.aQute.bnd.workspace'
}
rootProject.name = "emf.osgi-mcp"

// Exclude non-standard projects from Gradle build
def excludedProjects = [
  'docs'
] as Set

gradle.beforeProject { project ->
  if (project.name in excludedProjects) {
    project.tasks.configureEach { task ->
      task.enabled = false
    }
  }
}
