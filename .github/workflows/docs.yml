name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No workflow-level concurrency here, deliberately: the reusable workflow's deploy
# job already serialises on the job-level group `pages`. Declaring the same group
# here makes the deploy job deadlock against its own workflow run - it is
# cancelled before its first step (eclipse-fennec/.github#35).

jobs:
  docs:
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1
