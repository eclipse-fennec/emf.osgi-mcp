name: license

on:
  push:
    # main/snapshot run the license check as the first gating job of the
    # release.yml / snapshot.yml orchestrators, so exclude them here to avoid a
    # duplicate run. This standalone check covers all other (build-only) branches.
    branches-ignore:
      - main
      - snapshot
  pull_request:
  workflow_dispatch:

# Read-only by default; the header check needs to comment on pull requests.
permissions:
  contents: read

concurrency:
  group: license-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check License Header
        uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0
        env:
          # Needed only so License-Eye can comment on the pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
